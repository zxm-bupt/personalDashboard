[package]
name = "personal-workbench"
version = "0.7.4"
description = "Personal workbench with tasks, pomodoro and check-in"
authors = ["you"]
edition = "2021"

[lib]
name = "personal_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# 同步请求的 HTTPS 客户端。只开 rustls：证书校验只信任用户粘贴的自建 CA（tls_certs_only）
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# 计算 CA 证书指纹给用户核对（两者已经在依赖树里）
sha2 = "0.10"
base64 = "0.21"

# 番茄钟到时的系统通知。4.18 起 macOS 后端能回报点击，用来把隐藏在托盘的窗口唤回；
# 只在 macOS 上用到，关掉默认特性以免把 Linux 的 zbus 依赖带进来
[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4.18", default-features = false }
# 同步令牌存进钥匙串
security-framework = "3"

[features]
default = []
