name: Build Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    # Pinned rather than windows-latest, for the same reason as the macOS runner:
    # the image (and its toolchain) must not change under a release without notice.
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web lint
        run: pnpm lint

      # Unsigned for now: Windows shows a SmartScreen warning on first run.
      - name: Build Tauri Windows x64
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri build --target x86_64-pc-windows-msvc 2>&1 | tee build.log

      # Job logs need an authenticated download, but check-run annotations are public.
      # On failure, surface the tail of the build output as an annotation so the real
      # error is readable without logging in.
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          tail -n 60 build.log | sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' > tail.log
          message=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' tail.log | awk '{printf "%s%%0A", $0}')
          echo "::error title=tauri build output (last 60 lines)::${message}"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: personal-workbench-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
